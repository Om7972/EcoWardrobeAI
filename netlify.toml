[build]
  command = "npm run build:client"
  publish = "dist/spa"

# React Router routing support
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optional: proxy API requests to your Render backend to avoid CORS issues.
# Replace the URL below with your actual Render service URL.
# [[redirects]]
#   force = true
#   from = "/api/*"
#   status = 200
#   to = "https://your-backend-on-render.onrender.com/api/:splat"
